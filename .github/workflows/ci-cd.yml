
name: Playwright CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # CI: Validate, test and generate reports
  # ==========================================
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      allure_available: ${{ steps.allure.outputs.available }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        run: npx playwright test
        env:
          CI: true

      - name: Generate Allure HTML Report
        id: allure
        if: always()
        shell: bash
        run: |
          RESULTS_DIR="automation-testing/allure-results"
          REPORT_DIR="automation-testing/allure-report"

          echo "available=false" >> "$GITHUB_OUTPUT"

          if [ -d "$RESULTS_DIR" ] && \
             [ -n "$(find "$RESULTS_DIR" -name '*-result.json' -print -quit)" ]; then

            npx allure generate "$RESULTS_DIR" \
              --clean \
              -o "$REPORT_DIR"

            if [ -f "$REPORT_DIR/index.html" ]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "Allure HTML report generated."
            else
              echo "::error::Allure index.html not found."
              exit 1
            fi
          else
            echo "::warning::No Allure test results found."
          fi

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation-testing/playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: automation-testing/allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure HTML Report
        if: steps.allure.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: automation-testing/allure-report/
          retention-days: 30
          if-no-files-found: error

      - name: Fail CI if Playwright tests failed
        if: always() && steps.playwright.outcome == 'failure'
        run: |
          echo "::error::Playwright tests failed."
          exit 1

  # ==========================================
  # CD: Deploy Allure to GitHub Pages
  # ==========================================
  deploy:
    name: Deploy Allure Report
    runs-on: ubuntu-latest
    needs: test

    if: >-
      ${{
        always() &&
        needs.test.outputs.allure_available == 'true' &&
        github.event_name != 'pull_request' &&
        github.ref == 'refs/heads/main'
      }}

    permissions:
      contents: read
      pages: write
      id-token: write

    outputs:
      report_url: ${{ steps.deployment.outputs.page_url }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Download Allure HTML Report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Verify Allure HTML Report
        shell: bash
        run: |
          if [ ! -f "allure-report/index.html" ]; then
            echo "::error::Allure index.html not found."
            exit 1
          fi

          echo "Allure report is ready for deployment."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show Allure Report URL
        if: steps.deployment.outcome == 'success'
        shell: bash
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "## Allure Test Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[View Allure Report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Report URL: $REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================
  # SLACK: Notify CI/CD results
  # ==========================================
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest

    needs:
      - test
      - deploy

    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CI_STATUS: ${{ needs.test.result }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          REPORT_URL: ${{ needs.deploy.outputs.report_url }}
        run: node scripts/notify-slack.mjs
